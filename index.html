<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Third Person Prototype</title>
<style>
:root{color-scheme:dark;--panel:rgba(12,18,27,.78);--line:rgba(255,255,255,.12);--muted:#aab4c2;--accent:#8ee3d1}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111923;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;touch-action:none}
#view{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
.hud{position:fixed;z-index:3;pointer-events:none}.top{left:14px;right:14px;top:14px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.brand,.stats,.hint,.control,.mobile-btn{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(12px);box-shadow:0 8px 30px #0003}
.brand{padding:10px 13px;border-radius:14px}.brand b{display:block;font-size:13px;letter-spacing:.11em}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.stats{padding:9px 12px;border-radius:13px;text-align:right;font-size:11px;color:#cbd5df;line-height:1.55}.stats strong{color:var(--accent);font-weight:650}
.buttons{position:fixed;z-index:4;right:14px;top:88px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
button{font:inherit;color:#fff;cursor:pointer;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(12px);border-radius:12px;padding:10px 12px;font-size:11px;box-shadow:0 8px 25px #0003}button:active{transform:scale(.97)}
.hint{position:fixed;z-index:3;left:50%;bottom:20px;transform:translateX(-50%);border-radius:12px;padding:9px 13px;color:#c2ccd7;font-size:10px;white-space:nowrap;pointer-events:none}
.mobile{position:fixed;z-index:5;left:0;right:0;bottom:0;padding:0 18px 22px;display:none;align-items:flex-end;justify-content:space-between;pointer-events:none}
.joy-base{width:116px;height:116px;border:1px solid #ffffff30;border-radius:50%;background:#111b2c99;backdrop-filter:blur(8px);position:relative;pointer-events:auto;touch-action:none}
.joy-stick{position:absolute;width:48px;height:48px;left:34px;top:34px;border-radius:50%;background:#d7eee8cc;border:1px solid #fff9;box-shadow:0 3px 15px #0006}
.action-stack{display:flex;align-items:flex-end;gap:10px;pointer-events:auto}.mobile-btn{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;touch-action:none}.mobile-btn.primary{background:#b1eadc;color:#13231f;border-color:#d5fff4}.mobile-btn.active{outline:2px solid var(--accent)}
.toast{position:fixed;z-index:8;top:72px;left:50%;transform:translateX(-50%);max-width:calc(100% - 28px);padding:10px 14px;background:#172535ed;border:1px solid var(--line);border-radius:12px;font-size:11px;color:#e7f2f4;text-align:center;opacity:0;transition:opacity .22s;pointer-events:none}.toast.show{opacity:1}
@media(max-width:700px){.mobile{display:flex}.hint{display:none}.stats{font-size:10px}.brand{padding:9px 11px}.buttons{top:78px;right:12px}.buttons button{padding:9px 10px}.top{top:12px;left:12px;right:12px}}
@media(min-width:701px){.mobile{display:none}}
</style>

</script>
</head>

<div id="view"></div>
<div class="hud top">

</div>
<div class="buttons">
  <button id="switchBtn">Tampilkan FBX</button>
  <button id="flipBtn">Putar model 180°</button>
  <button id="resetBtn">Reset posisi</button>
</div>
<div class="hint">WASD / tombol panah untuk bergerak · Shift untuk lari · Spasi untuk lompat · Geser layar untuk putar kamera</div>
<div class="mobile">

  <div class="action-stack">
    <button class="mobile-btn" id="runBtn">LARI</button>
    <button class="mobile-btn primary" id="jumpBtn">LOMPAT</button>
  </div>
</div>

sun.shadow.mapSize.set(1024,1024); sun.shadow.camera.left=-12; sun.shadow.camera.right=12; sun.shadow.camera.top=12; sun.shadow.camera.bottom=-12;
scene.add(sun);

// Ground and a restrained test environment.
const floor = new THREE.Mesh(new THREE.PlaneGeometry(180,180), new THREE.MeshStandardMaterial({color:0x687a78, roughness:1}));
floor.rotation.x=-Math.PI/2; floor.position.y=-.035; floor.receiveShadow=true; scene.add(floor);
const grid = new THREE.GridHelper(100,100,0xb8c7c0,0x91a19b); grid.position.y=-.018; grid.material.transparent=true; grid.material.opacity=.22; scene.add(grid);
const centerRing = new THREE.Mesh(new THREE.RingGeometry(1.9,1.94,64),new THREE.MeshBasicMaterial({color:0xd6eee5,transparent:true,opacity:.23,side:THREE.DoubleSide}));centerRing.rotation.x=-Math.PI/2;centerRing.position.y=.002;scene.add(centerRing);

const actor = new THREE.Group(); scene.add(actor);
const player = {x:0,z:0,yaw:0,vy:0,onGround:true,walking:false,running:false};
let cameraYaw=0, cameraPitch=.22, useDemo=true, flipped=false, modelRoot=null, mixer=null, walkClip=null;
let fbxBones=[], fbxOriginalVisible=false;

const matSkin = new THREE.MeshStandardMaterial({color:0xaeb9bd,roughness:.72,metalness:.05});
const matJoint = new THREE.MeshStandardMaterial({color:0x89969c,roughness:.8});
const matShoe = new THREE.MeshStandardMaterial({color:0x65737a,roughness:.7});
const demo = new THREE.Group(); actor.add(demo);
function sphere(parent,r,pos,mat=matSkin){const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),mat);m.position.set(...pos);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}
function capsule(parent,r,len,pos,mat=matSkin){const m=new THREE.Mesh(new THREE.CapsuleGeometry(r,len,4,10),mat);m.position.set(...pos);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}
function limb(parent,r,len,mat=matSkin){const g=new THREE.Group();parent.add(g);const mesh=capsule(g,r,len,[0,-len/2,0],mat);return g;}
// Simple rig used when the uploaded FBX has no usable armature.
const torso=new THREE.Group(); torso.position.y=1.15; demo.add(torso);
capsule(torso,.205,.48,[0,.06,0]); sphere(torso,.205,[0,-.14,0]);
sphere(demo,.145,[0,1.82,0]); capsule(demo,.055,.08,[0,1.62,0]);
const shoulderL=new THREE.Group(); shoulderL.position.set(-.235,1.48,0); demo.add(shoulderL);
const shoulderR=new THREE.Group(); shoulderR.position.set(.235,1.48,0); demo.add(shoulderR);
const upperArmL=limb(shoulderL,.075,.34); const upperArmR=limb(shoulderR,.075,.34);
const elbowL=new THREE.Group(); elbowL.position.y=-.34; shoulderL.add(elbowL);
const elbowR=new THREE.Group(); elbowR.position.y=-.34; shoulderR.add(elbowR);
limb(elbowL,.061,.31); limb(elbowR,.061,.31); sphere(elbowL,.064,[0,0,0]);sphere(elbowR,.064,[0,0,0]);
const hipL=new THREE.Group();hipL.position.set(-.115,.91,0);demo.add(hipL);
const hipR=new THREE.Group();hipR.position.set(.115,.91,0);demo.add(hipR);
limb(hipL,.105,.48);limb(hipR,.105,.48);
const kneeL=new THREE.Group();kneeL.position.y=-.48;hipL.add(kneeL);
const kneeR=new THREE.Group();kneeR.position.y=-.48;hipR.add(kneeR);
limb(kneeL,.075,.46);limb(kneeR,.075,.46);
sphere(kneeL,.078,[0,0,0],matJoint);sphere(kneeR,.078,[0,0,0],matJoint);
const footL=new THREE.Group();footL.position.set(0,-.43,.045);kneeL.add(footL);
const footR=new THREE.Group();footR.position.set(0,-.43,.045);kneeR.add(footR);
const shoe1=new THREE.Mesh(new THREE.BoxGeometry(.15,.09,.25),matShoe);shoe1.position.set(0,-.015,.055);shoe1.castShadow=true;footL.add(shoe1);
const shoe2=shoe1.clone();shoe2.position.copy(shoe1.position);footR.add(shoe2);

function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.classList.remove('show'),2500);}
function toArrayBuffer(b64){const raw=atob(b64),out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out.buffer;}
function normalizeFBX(obj){const box=new THREE.Box3().setFromObject(obj);const size=box.getSize(new THREE.Vector3());const center=box.getCenter(new THREE.Vector3());const h=Math.max(size.y,.001);obj.scale.setScalar(1.78/h);obj.position.set(-center.x*obj.scale.x,-box.min.y*obj.scale.y,-center.z*obj.scale.z);obj.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){const mats=Array.isArray(o.material)?o.material:[o.material];mats.forEach(m=>{m.side=THREE.DoubleSide;if(m.map)m.map.colorSpace=THREE.SRGBColorSpace;});}}});}
function classifyBones(root){const found=[];root.traverse(o=>{if(o.isBone){const n=o.name.toLowerCase().replace(/[^a-z0-9]/g,'');found.push({o,n,base:o.quaternion.clone()});}});return found;}
function pickBone(list,patterns){return list.find(b=>patterns.some(p=>b.n.includes(p)));}
function makeBoneRig(list){const L=pickBone(list,['leftupleg','leftthigh','thighl','upperlegl']);const R=pickBone(list,['rightupleg','rightthigh','thighr','upperlegr']);const LL=pickBone(list,['leftleg','leftknee','calfl','lowerlegl']);const RR=pickBone(list,['rightleg','rightknee','calfr','lowerlegr']);const LA=pickBone(list,['leftarm','leftupperarm','upperarml']);const RA=pickBone(list,['rightarm','rightupperarm','upperarmr']);const LH=pickBone(list,['leftforearm','leftlowerarm','forearml']);const RH=pickBone(list,['rightforearm','rightlowerarm','forearmr']);
  const entries=[];for(const [b,k] of [[L,'legL'],[R,'legR'],[LL,'kneeL'],[RR,'kneeR'],[LA,'armL'],[RA,'armR'],[LH,'foreL'],[RH,'foreR']])if(b)entries.push({...b,k});return entries;}
function animateBoneRig(t,amount){for(const b of fbxBones){let a=0;switch(b.k){case'legL':a=Math.sin(t*8)*.55*amount;break;case'legR':a=-Math.sin(t*8)*.55*amount;break;case'kneeL':a=Math.max(0,-Math.sin(t*8))*.65*amount;break;case'kneeR':a=Math.max(0,Math.sin(t*8))*.65*amount;break;case'armL':a=-Math.sin(t*8)*.36*amount;break;case'armR':a=Math.sin(t*8)*.36*amount;break;case'foreL':a=.12*amount;break;case'foreR':a=.12*amount;break;}b.o.quaternion.copy(b.base).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),a));}}

try{
 const loader=new FBXLoader();
 const fbx=loader.parse(toArrayBuffer(MODEL_B64),'');
 normalizeFBX(fbx); modelRoot=new THREE.Group();modelRoot.add(fbx);actor.add(modelRoot);modelRoot.visible=false;
 const list=classifyBones(fbx);fbxBones=makeBoneRig(list);
 if(fbx.animations?.length){mixer=new THREE.AnimationMixer(fbx);walkClip=fbx.animations.find(c=>/walk|run/i.test(c.name))||fbx.animations[0];const action=mixer.clipAction(walkClip);action.play();}
 const hasAnimation=!!walkClip||fbxBones.length>=4;
 if(hasAnimation){useDemo=false;demo.visible=false;modelRoot.visible=true;document.getElementById('mode').textContent='FBX RIGGED';document.getElementById('switchBtn').textContent='Tampilkan demo';showToast('Model FBX berhasil dimuat dengan rig/animasi.');}
 else{useDemo=true;demo.visible=true;modelRoot.visible=false;document.getElementById('mode').textContent='DEMO WALKER';document.getElementById('switchBtn').textContent='Tampilkan FBX';showToast('FBX terbaca, tetapi rig/animasi jalan tidak terdeteksi. Demo berjalan aktif.');}
}catch(err){console.error(err);showToast('FBX gagal dimuat. Demo karakter tetap aktif.');}

function setCharacter(){demo.visible=useDemo;if(modelRoot)modelRoot.visible=!useDemo;document.getElementById('mode').textContent=useDemo?'DEMO WALKER':'FBX MODEL';document.getElementById('switchBtn').textContent=useDemo?'Tampilkan FBX':'Tampilkan demo';}
document.getElementById('switchBtn').addEventListener('click',()=>{if(!modelRoot){showToast('Model FBX belum berhasil dimuat.');return;}useDemo=!useDemo;setCharacter();});
document.getElementById('flipBtn').addEventListener('click',()=>{flipped=!flipped;actor.rotation.y=player.yaw+(flipped?Math.PI:0);showToast(flipped?'Arah model dibalik.':'Arah model normal.');});
document.getElementById('resetBtn').addEventListener('click',()=>{player.x=0;player.z=0;player.yaw=0;player.vy=0;cameraYaw=0;actor.position.set(0,0,0);showToast('Posisi direset.');});

const keys=new Set();addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase());});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
let joy={x:0,y:0,active:false},joyPointer=null;const joyEl=document.getElementById('joy'),stick=document.getElementById('stick');
function updateJoy(e){const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=37,d=Math.hypot(dx,dy)||1;if(d>max){dx=dx/d*max;dy=dy/d*max;}joy.x=dx/max;joy.y=-dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`;}
joyEl.addEventListener('pointerdown',e=>{joyPointer=e.pointerId;joy.active=true;joyEl.setPointerCapture(e.pointerId);updateJoy(e);});joyEl.addEventListener('pointermove',e=>{if(joy.active&&e.pointerId===joyPointer)updateJoy(e);});function endJoy(){joy.active=false;joy.x=joy.y=0;joyPointer=null;stick.style.transform='translate(0,0)';}joyEl.addEventListener('pointerup',endJoy);joyEl.addEventListener('pointercancel',endJoy);
let runTouch=false;const runBtn=document.getElementById('runBtn');runBtn.addEventListener('pointerdown',e=>{runTouch=true;runBtn.classList.add('active');});['pointerup','pointercancel','pointerleave'].forEach(ev=>runBtn.addEventListener(ev,()=>{runTouch=false;runBtn.classList.remove('active');}));
function jump(){if(player.onGround){player.vy=5.2;player.onGround=false;}}document.getElementById('jumpBtn').addEventListener('pointerdown',jump);

// Drag anywhere outside controls to orbit the follow camera.
let dragging=false,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);});renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;cameraYaw-=dx*.005;cameraPitch=THREE.MathUtils.clamp(cameraPitch+dy*.002,-.05,.65);});renderer.domElement.addEventListener('pointerup',()=>dragging=false);renderer.domElement.addEventListener('pointercancel',()=>dragging=false);

const clock=new THREE.Clock();let elapsed=0,frames=0,fpsTimer=0;const target=new THREE.Vector3(),camGoal=new THREE.Vector3();
function update(dt){elapsed+=dt;
 let forward=(keys.has('w')||keys.has('arrowup')?1:0)-(keys.has('s')||keys.has('arrowdown')?1:0)+joy.y;
 let side=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0)+joy.x;
 const mag=Math.hypot(forward,side);if(mag>1){forward/=mag;side/=mag;}
 const moving=mag>.08;const running=keys.has('shift')||runTouch;const speed=running?5.1:2.8;
 const fwd=new THREE.Vector3(Math.sin(cameraYaw),0,Math.cos(cameraYaw));const right=new THREE.Vector3(Math.cos(cameraYaw),0,-Math.sin(cameraYaw));
 const velocity=fwd.multiplyScalar(forward).add(right.multiplyScalar(side));
 if(moving){player.x+=velocity.x*speed*dt;player.z+=velocity.z*speed*dt;player.yaw=Math.atan2(velocity.x,velocity.z);}
 player.vy-=13*dt;player.y+=player.vy*dt;if(player.y<=0){player.y=0;player.vy=0;player.onGround=true;}
 actor.position.set(player.x,player.y,player.z);actor.rotation.y=player.yaw+(flipped?Math.PI:0);
 const amount=moving?(running?1.25:1):0;
 if(useDemo){const cycle=elapsed*(running?10:7.8);demo.position.y=moving?Math.abs(Math.sin(cycle*2))*.035:Math.sin(elapsed*1.7)*.006;torso.rotation.x=moving?Math.sin(cycle)*.035:0;hipL.rotation.x=moving?Math.sin(cycle)*.62* (running?1.15:1):0;hipR.rotation.x=moving?-Math.sin(cycle)*.62*(running?1.15:1):0;kneeL.rotation.x=moving?Math.max(0,-Math.sin(cycle))*.72:0;kneeR.rotation.x=moving?Math.max(0,Math.sin(cycle))*.72:0;shoulderL.rotation.x=moving?-Math.sin(cycle)*.42:0;shoulderR.rotation.x=moving?Math.sin(cycle)*.42:0;elbowL.rotation.x=moving?.12:0;elbowR.rotation.x=moving?.12:0;footL.rotation.x=moving?-Math.max(0,Math.sin(cycle))*.25:0;footR.rotation.x=moving?-Math.max(0,-Math.sin(cycle))*.25:0;}
 if(fbxBones.length)animateBoneRig(elapsed,amount);
 if(mixer){const action=mixer._actions?.[0];if(action)action.paused=!moving; mixer.update(dt);}
 player.walking=moving;player.running=running&&moving;
 target.set(player.x,1.05+player.y,player.z);
 const distance=5.3;camGoal.set(player.x+Math.sin(cameraYaw)*distance,player.y+2.55+cameraPitch*2,player.z-Math.cos(cameraYaw)*distance);
 camera.position.lerp(camGoal,1-Math.pow(.001,dt));camera.lookAt(target);
}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);update(dt);renderer.render(scene,camera);frames++;fpsTimer+=dt;if(fpsTimer>.7){document.getElementById('fps').textContent=Math.round(frames/fpsTimer);frames=0;fpsTimer=0;}}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
